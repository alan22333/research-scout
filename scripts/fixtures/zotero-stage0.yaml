  - key: ITEM-FULLTEXT-001
    title: Hybrid Retrieval for Scientific Literature
    abstract: We study lexical and dense retrieval for scientific question answering.
    year: 2024
    venue: SIGIR
    doi: 10.1000/stage0.fulltext
    item_type: conferencePaper
    collections: [COLL-RETRIEVAL]
    authors: [Ada Example, Ben Fixture]
    zotero_version: 101
    fulltext: |
      Hybrid retrieval for scientific literature combines lexical search with dense retrieval.
      We apply reciprocal rank fusion to merge sparse and dense candidate lists before reranking.
      The evaluation shows that reciprocal rank fusion improves recall while preserving citation traceability.

      The system filters stale document versions and pins every query to an immutable index epoch.
      This prevents partially built indexes from leaking into research answers.
